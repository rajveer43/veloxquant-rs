[package]
name = "veloxquant"
description = "VeloxQuant for Rust — memory intelligence and optimization for local AI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
veloxquant-core = { workspace = true }
veloxquant-system = { workspace = true }
veloxquant-memory = { workspace = true }
veloxquant-runtime = { workspace = true, optional = true }
veloxquant-openai = { workspace = true, optional = true }
veloxquant-monitor = { workspace = true, optional = true }
veloxquant-models = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
futures-util = { workspace = true, optional = true }
rmcp = { version = "3", optional = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { workspace = true, optional = true, features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
axum = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
rmcp = { version = "3", features = ["client", "server", "macros", "transport-async-rw", "schemars"] }
schemars = "1"

[[example]]
name = "chat"
required-features = ["openai"]

[[example]]
name = "streaming"
required-features = ["openai"]

[[example]]
name = "axum_server"

[[example]]
name = "agent"
required-features = ["agent"]

[[example]]
name = "mcp_agent"
required-features = ["mcp"]

[features]
default = ["runtime", "openai"]
runtime = ["dep:veloxquant-runtime"]
openai = [
    "dep:veloxquant-openai",
    "dep:reqwest",
    "dep:serde",
    "dep:futures-util",
    "dep:tokio",
    "runtime",
]
monitor = ["dep:veloxquant-monitor"]
native-optimizers = []
local-models = ["dep:veloxquant-models"]
agent = ["openai", "dep:async-trait"]
mcp = ["agent", "dep:rmcp", "dep:tokio"]
