[package]
name = "veloxquant-rig"
description = "rig-core CompletionModel adapter for the VeloxQuant Rust SDK"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
veloxquant = { path = "../veloxquant", version = "0.2.1", features = ["openai"] }
veloxquant-core = { workspace = true }
veloxquant-openai = { workspace = true }
rig-core = "0.42"
futures-util = { workspace = true }
async-stream = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[[example]]
name = "rig_integration"
