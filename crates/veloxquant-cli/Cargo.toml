[package]
name = "veloxquant-cli"
description = "vq — the VeloxQuant command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Distributed as prebuilt binaries on GitHub releases, not on crates.io (see
# README); scripts/publish-crates.sh skips it.
publish = false

[[bin]]
name = "vq"
path = "src/main.rs"

[dependencies]
veloxquant = { path = "../veloxquant", version = "0.3.0", features = ["local-models"] }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
