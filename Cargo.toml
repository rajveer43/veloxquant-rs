[workspace]
resolver = "2"
members = [
    "crates/veloxquant-core",
    "crates/veloxquant-system",
    "crates/veloxquant-memory",
    "crates/veloxquant-runtime",
    "crates/veloxquant-openai",
    "crates/veloxquant-monitor",
    "crates/veloxquant-cli",
    "crates/veloxquant",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rajveer43/veloxquant-rs"
homepage = "https://github.com/rajveer43/veloxquant-rs"
authors = ["VeloxQuant Contributors"]
keywords = ["llm", "apple-silicon", "memory", "inference", "mlx"]
categories = ["development-tools", "hardware-support"]

[workspace.dependencies]
veloxquant-core = { path = "crates/veloxquant-core", version = "0.2.0" }
veloxquant-system = { path = "crates/veloxquant-system", version = "0.2.0" }
veloxquant-memory = { path = "crates/veloxquant-memory", version = "0.2.0" }
veloxquant-runtime = { path = "crates/veloxquant-runtime", version = "0.2.0" }
veloxquant-openai = { path = "crates/veloxquant-openai", version = "0.2.0" }
veloxquant-monitor = { path = "crates/veloxquant-monitor", version = "0.2.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
async-stream = "0.3"
sysinfo = "0.32"

clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
