name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New workspace version (e.g. 0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Bump version, tag, and push
    runs-on: macos-15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a valid semver x.y.z version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run bump script
        run: ./scripts/bump-version.sh "${{ inputs.version }}"

      - name: Verify workspace builds at new version
        run: cargo build --workspace --all-features

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ inputs.version }}"

      # The tag push above uses GITHUB_TOKEN, which does not trigger
      # release.yml's `push: tags` trigger; dispatch it on the tag instead.
      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${{ inputs.version }}"
