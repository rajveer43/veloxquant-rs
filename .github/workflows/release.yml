name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Tags pushed by bump-version.yml use GITHUB_TOKEN, which never triggers
  # a `push` workflow; it dispatches this workflow on the tag ref instead
  # (workflow_dispatch is GitHub's documented exception).
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The full CI workflow (fmt, clippy, the test matrix, MSRV, package +
  # publish plan) gates every release job below, not just `cargo test`.
  ci:
    uses: ./.github/workflows/ci.yml

  verify-tag:
    name: tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag to workspace.package.version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::releases must run on a tag ref (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})"
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

  build-cli:
    name: build vq (${{ matrix.target }})
    needs: [ci, verify-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          # Cross-compiled on Apple Silicon: the old macos-13 runner is
          # retired, and the v0.2.1 release sat waiting 24h for one. This
          # keeps working after GitHub drops Intel runners in August 2027.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p veloxquant-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vq dist/vq-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vq-${{ matrix.target }}
          path: dist/vq-${{ matrix.target }}

  github-release:
    name: GitHub release
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/vq-*
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: [ci, verify-tag]
    runs-on: macos-15
    # Opt-in: set the PUBLISH_TO_CRATES_IO repo variable to 'true' once the
    # CARGO_REGISTRY_TOKEN secret is configured.
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Order comes from `cargo metadata`; crates already on crates.io at
        # their current version are skipped, so re-running a partially
        # failed release is safe. See the script header for details.
        run: ./scripts/publish-crates.sh
